spring:
  application:
    name: ${SERVICE_NAME:sentinel-ai}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinel}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel_secure_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}

# LLM Provider Configuration
sentinel:
  providers:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      model: gpt-4o
      max-tokens: 2048
      temperature: 0.3
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: https://api.anthropic.com/v1
      model: claude-sonnet-4-20250514
      max-tokens: 2048
      temperature: 0.3
  audit:
    provider: ${AUDIT_PROVIDER:ANTHROPIC}
    strict-mode: false
    timeout-ms: 30000
  compliance:
    rules-path: classpath:rules/sec-finra-rules.json

# Logging
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.sentinel.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
